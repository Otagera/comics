name: Build & Deploy

# Push to main (or run manually) builds the sidecar image, publishes it to
# GHCR, and tells lumina-1 to pull it.
#
# The host never builds. It used to, and the layer cache repeatedly filled a
# root disk that sits around 90% -- roughly 600 MB reclaimed per prune. CI has
# the disk and the cache, so the host only ever pulls a finished image.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Deploy without running tests (use sparingly)'
        type: boolean
        default: false

concurrency:
  # A newer push supersedes an in-flight deploy, but never interrupt one
  # half-way: cancelling between `pull` and `up` would leave the host on a
  # stale image.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: comics-sidecar

jobs:
  test:
    if: github.event.inputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suite runs straight from TypeScript via Node's type stripping,
      # the same way the maintenance CLI runs in production.
      - run: npm test
      - run: npm run build

  build:
    needs: [test]
    # `always()` so a manual skip_tests run still builds; the guard below keeps
    # a genuine test failure from shipping.
    if: always() && !cancelled() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged with the commit too, so a bad deploy can be rolled back by
          # pointing SIDECAR_IMAGE at the previous sha.
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,scope=sidecar,mode=max

  deploy:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Open SSH to lumina-1
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust-on-first-use. Set DEPLOY_KNOWN_HOSTS to pin the host key.
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Ship compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Only the compose file travels. .env and logs/ live on the host and
          # are never touched; the application itself is inside the image.
          scp -i ~/.ssh/id_deploy docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Pull and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}
          SHA_IMAGE: ghcr.io/${{ github.repository_owner }}/comics-sidecar:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            IMAGE="$SHA_IMAGE" DEPLOY_PATH="$DEPLOY_PATH" \
            GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" 'bash -seu' <<'REMOTE'
          cd "$DEPLOY_PATH"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # Pin to the commit image rather than :latest so the running
          # container is always traceable to a commit.
          if grep -q '^SIDECAR_IMAGE=' .env; then
            sed -i "s|^SIDECAR_IMAGE=.*|SIDECAR_IMAGE=$IMAGE|" .env
          else
            printf '\nSIDECAR_IMAGE=%s\n' "$IMAGE" >> .env
          fi

          docker compose pull sidecar
          # --no-build: the host must never build. If the image is missing,
          # fail loudly here instead of quietly compiling on a full disk.
          docker compose up -d --no-build sidecar

          docker logout ghcr.io >/dev/null 2>&1 || true
          # Keep the root disk from creeping back up.
          docker image prune -f >/dev/null
          df -h / | tail -1
          REMOTE

      - name: Smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" 'bash -seu' <<'REMOTE'
          cd "$DEPLOY_PATH"
          port="$(grep -m1 '^SIDECAR_LOCAL_PORT=' .env | cut -d= -f2- || true)"
          port="${port:-3001}"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/" || true)"
            if [ "$code" = "200" ]; then
              echo "sidecar healthy after ${i}s"
              docker exec comics-sidecar node --experimental-strip-types \
                /app/src/server/cli.ts status 2>&1 | tail -3
              exit 0
            fi
            sleep 1
          done
          echo "sidecar did not return 200 within 30s" >&2
          docker logs --tail 40 comics-sidecar >&2
          exit 1
          REMOTE

      - name: Revoke key
        if: always()
        run: rm -f ~/.ssh/id_deploy
