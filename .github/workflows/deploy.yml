name: Build & Deploy

# Push to main (or run manually): test, build the sidecar image, publish it to
# GHCR, then ask Coolify to redeploy.
#
# Coolify owns the deployment. It runs the stack, restarts it, and keeps the
# logs; CI only produces the image and pulls the trigger. Nothing here SSHes
# into the host -- if this workflow deployed directly it would fight Coolify
# over the same containers.
#
# The host still never builds: the layer cache repeatedly filled a root disk
# sitting above 90%. CI has the disk and the cache; Coolify pulls a finished
# image.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Deploy without running tests (use sparingly)'
        type: boolean
        default: false

concurrency:
  # A newer push supersedes an in-flight deploy, but never interrupt one
  # half-way: Coolify is mid-restart and cancelling leaves it half-applied.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: comics-sidecar

jobs:
  test:
    if: github.event.inputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The suite runs straight from TypeScript via Node's type stripping,
      # the same way the maintenance CLI runs in production.
      - run: npm test
      - run: npm run build

  build:
    needs: [test]
    # `always()` so a manual skip_tests run still builds; the guard keeps a
    # genuine test failure from shipping.
    if: always() && !cancelled() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Coolify pulls :latest on redeploy. The sha tag is the rollback
          # handle: point SIDECAR_IMAGE at it in Coolify and redeploy.
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,scope=sidecar,mode=max

  deploy:
    needs: [build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify redeploy
        run: |
          # Not `curl -f`: that exits 22 with no status code and no body, which
          # made two real misconfigurations (a token without deploy rights, and
          # the wrong webhook URL) look identical from the log.
          code="$(curl -sS -o /tmp/coolify.out -w '%{http_code}' \
            -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" || echo 000)"
          echo "HTTP $code"
          head -c 2000 /tmp/coolify.out || true
          echo
          case "$code" in
            2*)  echo "Coolify redeploy triggered — follow it in the Coolify UI." ;;
            401) echo "::error::401 — COOLIFY_TOKEN was not accepted." ; exit 1 ;;
            403) echo "::error::403 — token accepted but lacks deploy permission, or belongs to a different Coolify team than the resource." ; exit 1 ;;
            404|405)
                 echo "::error::$code — wrong URL. Use the API deploy endpoint, not the git webhook: https://<coolify-host>/api/v1/deploy?uuid=<resource-uuid>&force=false" ; exit 1 ;;
            000) echo "::error::could not reach Coolify at all — check COOLIFY_WEBHOOK_URL is reachable from GitHub." ; exit 1 ;;
            *)   echo "::error::unexpected HTTP $code from Coolify." ; exit 1 ;;
          esac
