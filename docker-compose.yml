# Comics stack: Komga (reader/library) + the sidecar (Drive-backed catalogue).
#
# One deployment. Both services, both domains, one `docker compose up`.
# Everything environment-specific -- domains, volume location, credentials --
# comes from a .env file beside this one; see .env.example.
#
# Deployed by Coolify (Docker Compose resource); CI builds the sidecar image
# and asks Coolify to redeploy. Coolify names the containers, so nothing here
# sets container_name -- find a service by its `vault.role` label instead.
#
# Every bind mount is an explicit path under ${VOLUME_ROOT}. That matters:
# images that declare their own VOLUME get a fresh anonymous volume on the
# host's near-full root disk at every redeploy unless a bind overrides it.
#
# Volume sources, ports, domains and the proxy network are written out in
# full rather than as ${VARIABLES}. Coolify interpolates `environment:` only:
# a variable in `volumes:` becomes a *named volume* on the root disk, and one
# in `labels:` reaches Traefik as literal text, so no router matches and every
# request answers "no available server".
#
# Leave the domain fields in Coolify empty -- routing is declared here. DNS for
# both domains must be unproxied (grey cloud), because the certificate resolver
# uses an HTTP-01 challenge.

services:
  komga:
    image: gotson/komga:${KOMGA_VERSION:-1.26.3}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - JAVA_TOOL_OPTIONS=-Xmx${KOMGA_HEAP:-512m}
    volumes:
      - /mnt/HC_Volume_106816620/komga-library:/data
      # The image declares VOLUME /config. This bind overrides it -- without
      # it Docker makes a fresh anonymous volume on the root disk at every
      # redeploy, which is how a previous stack filled that disk.
      - /mnt/HC_Volume_106816620/komga-config:/config
    ports:
      - "127.0.0.1:25600:25600"
    networks:
      - proxy
    labels:
      - vault.role=komga
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.http-komga.entryPoints=http
      - traefik.http.routers.http-komga.rule=Host(`komga.otagera.xyz`)
      - traefik.http.routers.http-komga.middlewares=redirect-to-https
      - traefik.http.routers.http-komga.service=komga
      - traefik.http.routers.https-komga.entryPoints=https
      - traefik.http.routers.https-komga.rule=Host(`komga.otagera.xyz`)
      - traefik.http.routers.https-komga.middlewares=gzip
      - traefik.http.routers.https-komga.service=komga
      - traefik.http.routers.https-komga.tls=true
      - traefik.http.routers.https-komga.tls.certresolver=letsencrypt
      - traefik.http.services.komga.loadbalancer.server.port=25600

  sidecar:
    # CI builds this and pushes it to GHCR, and the host only ever pulls --
    # building on lumina-1 filled its root disk with layer cache. `build` is
    # kept so `docker compose up --build` still works for local development;
    # deploys use `docker compose up --no-build`.
    image: ${SIDECAR_IMAGE:-comics-sidecar:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - komga
    environment:
      - TZ=${TZ:-UTC}
      # The volume mounts at a fixed in-container path. It used to mount at
      # its own host path so SQLite paths read identically inside and out,
      # but that put a ${...} on the right-hand side of a volume, which
      # parsers that validate before interpolating reject.
      - CS_VOLUME=/vault
      - CS_LIBRARY_ROOT=/vault/komga-library
      - CS_LIBRARY_ROOT_KOMGA=/data
      - CS_DB_PATH=/vault/sidecar-data/comics.db
      - CS_STAGING_DIR=/vault/sidecar-data/staging
      - CS_TMPDIR=/vault/tmp
      - CS_KOMGA_URL=http://komga:25600
      - CS_KOMGA_API_KEY=${KOMGA_API_KEY}
      - CS_KOMGA_LIBRARY_ID=${KOMGA_LIBRARY_ID}
      - CS_RCLONE_CONFIG=/config/rclone.conf
      - CS_DRIVE_REMOTE=${DRIVE_REMOTE:-gdrive:Comics}
      - CS_BUDGET_PCT=${BUDGET_PCT:-80}
      # Basic auth is enforced by the app, not the proxy: Coolify interpolates
      # environment but not labels, and the password hash must not be
      # hard-coded into a public repository. Unset means no auth (local dev).
      - CS_AUTH_USER=${SIDECAR_USER}
      - CS_AUTH_PASSWORD=${SIDECAR_PASSWORD}
      # One-way Vault -> Notion sync. Unset means the sync is simply off.
      - NOTION_TOKEN=${NOTION_TOKEN}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
    volumes:
      - /mnt/HC_Volume_106816620:/vault
      - /root/.config/rclone/rclone.conf:/config/rclone.conf:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - proxy
    labels:
      - vault.role=sidecar
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.http-comics.entryPoints=http
      - traefik.http.routers.http-comics.rule=Host(`comics.otagera.xyz`)
      - traefik.http.routers.http-comics.middlewares=redirect-to-https
      - traefik.http.routers.http-comics.service=comics
      - traefik.http.routers.https-comics.entryPoints=https
      - traefik.http.routers.https-comics.rule=Host(`comics.otagera.xyz`)
      - traefik.http.routers.https-comics.middlewares=gzip
      - traefik.http.routers.https-comics.service=comics
      - traefik.http.routers.https-comics.tls=true
      - traefik.http.routers.https-comics.tls.certresolver=letsencrypt
      - traefik.http.services.comics.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-coolify}
